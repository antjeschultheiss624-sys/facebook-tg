<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #1877f2;
      color: white;
      padding: 16px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    button {
      background: #1877f2;
      color: white;
      border: none;
      padding: 15px 25px;
      border-radius: 8px;
      font-size: 17px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <header>Facebook</header>

  <main>
    <div>
      <h2>Access Facebook</h2>
      <p>Open Facebook from Telegram.</p>

      <button onclick="openFacebook()">
        Open Facebook
      </button>
    </div>
  </main>

  <script>
    function openFacebook() {
      window.open("https://www.facebook.com/", "_blank");
    }
  </script>
</body>
</html>
